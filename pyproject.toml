[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-learner"
version = "0.1.0"
description = "Controlled experiments in learning to ask, remember, and answer"
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
language = ["transformers>=4.57,<5", "accelerate>=1,<2"]

[project.scripts]
autonomous-learner = "autonomous_learner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
