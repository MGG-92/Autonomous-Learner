name: tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/publication_check.py
      - run: python -m autonomous_learner demo --memory runs/ci-demo.sqlite
      - run: python -m autonomous_learner run --session runs/ci-session.json --ticks 2
      - run: python -m autonomous_learner run --session runs/ci-session.json --ticks 8
      - run: python -m autonomous_learner experiment --config configs/smoke.json --output runs/ci
      - run: python -m autonomous_learner delayed-memory --config configs/delayed-memory-smoke.json --output runs/ci-delayed --phase validation
      - run: python -m autonomous_learner rule-discovery --config configs/rule-discovery-smoke.json --output runs/ci-rules
      - run: python -m autonomous_learner learned-investigation --config configs/learned-investigation-smoke.json --output runs/ci-query-policy
      - run: python -m autonomous_learner action-model-demo --output runs/ci-action-model.json
      - run: python -m autonomous_learner action-prediction --config configs/action-prediction-smoke.json --output runs/ci-action-prediction
      - run: python -m autonomous_learner action-goals --config configs/action-goals-smoke.json --output runs/ci-action-goals
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.python }}
          path: |
            runs/ci/report.json
            runs/ci/curve.csv
            runs/ci-delayed/report.json
            runs/ci-delayed/world-metrics.csv
            runs/ci-rules/report.json
            runs/ci-query-policy/report.json
            runs/ci-action-model.json
            runs/ci-action-prediction/report.json
            runs/ci-action-goals/report.json
