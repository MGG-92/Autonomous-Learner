name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/publication_check.py
      - run: python -m autonomous_learner demo --memory runs/ci-demo.sqlite
      - run: python -m autonomous_learner experiment --config configs/smoke.json --output runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.python }}
          path: |
            runs/ci/report.json
            runs/ci/curve.csv
